appId: com.jackaistudio.jackdsh
productName: JackDSH
npmRebuild: false
directories:
  # 默认输出到仓库内 release/（CI 直接用）。
  # 本机 macOS 构建时 package.json 脚本会用 -c.directories.output 覆盖到
  # $DSH_BUILD_OUT（默认 ~/.jds-build-out）：输出必须落在 iCloud（桌面与文稿
  # 同步）管理范围之外，否则 FileProvider 会给产物打上
  # com.apple.fileprovider.fpfs#P 等扩展属性，codesign 报 "detritus not allowed"。
  output: release
  buildResources: build

files:
  - "src/**/*"
  - "config-templates/**/*"
  - "package.json"

extraResources:
  - from: "bundle-runtime/"
    to: "runtime"
    filter:
      - "**/*"
  - from: "node_modules/"
    to: "node_modules"
    filter:
      - "!**/* 2*"
      - "!**/.bin/**"
      - "!**/*.md"
      - "!**/*.ts"
      - "!**/*.map"
      - "!.pnpm/**"
      - "!.pnpm*/**"
      - "!.pnpm-workspace-state-v1.json"
      # node-pty 构建残留的绝对符号链接（指向 homebrew python），
      # codesign --verify --strict 会判 "invalid destination for symbolic link"
      - "!**/node-pty/build/node_gyp_bins/**"
      # 纯构建期工具，运行期不需要；剔除可大幅缩小体积与签名耗时
      - "!electron/**"
      - "!electron-builder/**"
      - "!app-builder-lib/**"
      - "!app-builder-bin/**"
      - "!builder-util/**"
      - "!dmg-builder/**"
      - "!electron-publish/**"
      - "!7zip-bin/**"
      - "!typescript/**"
      # 排除非 macOS 平台的预编译底层 C++ 库（防止全平台二进制撑爆包体）
      - "!@img/sharp-libvips-linux*/**"
      - "!@img/sharp-libvips-win32*/**"
      - "!@img/sharp-libvips-darwin-x64/**"
      - "!@img/sharp-linux*/**"
      - "!@img/sharp-win32*/**"
      - "!@img/sharp-darwin-x64/**"
      - "!@img/sharp-wasm32/**"
      - "!@img/sharp-freebsd*/**"
      - "!@vscode/ripgrep-linux*/**"
      - "!@vscode/ripgrep-win32*/**"
      - "!@vscode/ripgrep-darwin-x64/**"
      - "!@deepseek-ai/node-addon-system-linux*/**"
      - "!@deepseek-ai/node-addon-system-win32*/**"
      - "!@deepseek-ai/node-addon-system-darwin-x64/**"

mac:
  category: public.app-category.developer-tools
  # 极简双版本：macOS 仅提供 Apple Silicon (M1/M2/M3/M4) arm64 dmg 镜像
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: "${productName}-${version}-Mac-arm64.${ext}"
  # 公证（notarization）要求开启 hardened runtime；无公证凭据时仅影响签名配置，不影响构建
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  # Windows 仅提供纯净绿色免安装便携版（解压即用、零污染注册表、适合随身携带与安全审计）
  target:
    - target: zip
      arch:
        - x64
  artifactName: "${productName}-${version}-Windows-portable.${ext}"
