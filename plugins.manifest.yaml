    ref: main
  - name: dsh-robust-search
    repo: https://github.com/JackAIStudio/dsh-robust-search.git
    ref: main
  - name: dsh-reminder
    repo: https://github.com/JackAIStudio/dsh-reminder.git
    ref: main
  - name: dsh-app-badge
